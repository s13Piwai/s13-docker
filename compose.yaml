services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: s13-training-camps:latest
    container_name: s13-training-camps
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp

volumes:
  app-data:
    name: s13-training-camps-data
